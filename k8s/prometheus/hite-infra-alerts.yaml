apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hite-infra-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
  - name: hite-infra-rules
    rules:
    - alert: HITE_NodeCPUHigh
      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "CPU node tinggi di atas 90% selama 5 menit"
        description: "CPU usage saat ini tinggi"
    - alert: HITE_NodeMemoryHigh
      expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Memory node tinggi di atas 85% selama 5 menit"
        description: "Memory usage saat ini tinggi"
    - alert: HITE_NodeDiskHigh
      expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) > 90
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Disk node di atas 90%"
        description: "Disk usage saat ini tinggi"
    - alert: HITE_PodCrashLooping
      expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Pod CrashLoopBackOff terdeteksi"
        description: "Container terus restart"
    - alert: HITE_NodeDown
      expr: up{job="node-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node exporter tidak terjangkau"
        description: "Kemungkinan node down atau network terputus"
    - alert: HITE_QdrantDown
      expr: up{job="qdrant"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Qdrant tidak terjangkau"
        description: "Vector database Qdrant down, Rust API kemungkinan akan gagal retrieval"
    - alert: HITE_NodeMemoryPressure
      expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} mengalami Memory Pressure"
        description: "Kubelet mendeteksi tekanan memory tinggi, pod bisa mulai di-evict"
    - alert: HITE_NodeDiskPressure
      expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} mengalami Disk Pressure"
        description: "Kubelet mendeteksi tekanan disk tinggi, pod bisa mulai di-evict"
    - alert: HITE_NodeRecentlyRestarted
      expr: (time() - node_boot_time_seconds{job="node-exporter"}) < 300
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} baru saja restart"
        description: "Node ini reboot dalam 5 menit terakhir"
    - alert: HITE_ContainerMemoryNearLimit
      expr: |
        (container_memory_working_set_bytes{container!="", container!="POD"}
        /
        on(namespace, pod, container) kube_pod_container_resource_limits{resource="memory"})
        > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} mendekati memory limit"
        description: "Penggunaan memory sudah di atas 90% dari limit yang di-set"
    - alert: HITE_ContainerCPUThrottled
      expr: |
        (sum(rate(container_cpu_cfs_throttled_periods_total{container!="", container!="POD"}[5m])) by (namespace, pod, container)
        /
        sum(rate(container_cpu_cfs_periods_total{container!="", container!="POD"}[5m])) by (namespace, pod, container))
        > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} sering di-throttle CPU"
        description: "Lebih dari 50% periode CPU mengalami throttling, container kekurangan CPU limit"
    - alert: HITE_DeploymentReplicasMismatch
      expr: kube_deployment_spec_replicas != kube_deployment_status_replicas
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica tidak sesuai target"
        description: "Jumlah replica berjalan tidak sama dengan yang diinginkan selama 5 menit"
    - alert: HITE_ApiGatewayDown
      expr: up{job="api-gateway"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "API Gateway (Rust) tidak terjangkau"
        description: "api-gateway down, seluruh alur ticket triage HITE akan terhenti"
    - alert: HITE_MacMiniDown
      expr: up{job="mac-mini-external"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Mac Mini (AI Inference Server) tidak terjangkau"
        description: "Node exporter Mac Mini down via Tailscale, kemungkinan Ollama/LLM juga terganggu"
