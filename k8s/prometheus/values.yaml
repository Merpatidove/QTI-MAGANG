# ========================================================
# KUBE-PROMETHEUS-STACK PRODUCTION CONFIGURATION (OPTIMIZED)
# ========================================================

# 1. ALERTMANAGER
# Dinonaktifkan untuk hemat resource (aktifkan jika butuh notifikasi Slack/Email)
alertmanager:
  enabled: false

# 2. PROMETHEUS
prometheus:
  prometheusSpec:
    # --- PERBAIKAN NFS PERMISSION ---
    securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true

    # Memastikan pod hanya berjalan di worker node
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker-1
                    - worker-2

    imagePullPolicy: IfNotPresent

    # RETENSI DITINGKATKAN (Dapat menyimpan data 14 hari)
    retention: 14d
    retentionSize: "25GiB"

    # PENYIMPANAN PERMANEN (NFS)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "nfs-csi"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

    # PEMBATASAN RESOURCE (Dinaikkan agar stabil untuk RAM 32GB)
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

# 3. GRAFANA
grafana:
  image:
    pullPolicy: IfNotPresent

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - worker-1
                  - worker-2

  # PERSISTENSI DASHBOARD (NFS)
  persistence:
    enabled: true
    storageClassName: "nfs-csi"
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  # PEMBATASAN RESOURCE GRAFANA
  resources:
    requests:
      memory: "250Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # AKSES EKSTERNAL
  service:
    type: NodePort
    nodePort: 30000

# 4. NODE EXPORTER
prometheus-node-exporter:
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi
